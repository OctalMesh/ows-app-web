# ============================================================================ #
#                                CodeQL Workflow                               #
# ============================================================================ #
# Runs GitHub CodeQL security and quality analysis on every push to dev, on    #
# every pull request targeting dev, and on a weekly schedule.                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip] - skips all workflows                                            #
#   [ql-skip] - skips this workflow only                                       #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  schedule:
    # Runs every Monday at 6:00 AM UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: skip_check
        env:
          SKIP_TAGS: "[ci-skip] [ql-skip]"
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        # For pull_request events: use PR title + latest commit message
        # For push events: use the latest commit message from git log
        # Scheduled runs: always execute regardless of skip tags
        run: |
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --format="%s %b")
          COMBINED="${PR_TITLE} ${COMMIT_MSG}"

          for tag in $SKIP_TAGS; do
            if [[ "$COMBINED" == *"$tag"* ]]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "should_skip=false" >> $GITHUB_OUTPUT

  # Perform CodeQL analysis
  analyze:
    name: "Analyze (${{ matrix.language }})"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "javascript-typescript"
            build-mode: "none"

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: "Setup: Get pnpm store path"
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: "Setup: Cache pnpm store"
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: "Setup: Install Node.js dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Setup: Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          config-file: "./.github/codeql/codeql-config.yaml"
          languages: "${{ matrix.language }}"
          build-mode: "${{ matrix.build-mode }}"

      - name: "Run: Perform CodeQL analysis"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
