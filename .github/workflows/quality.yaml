name: "Quality"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mts"
      - "eslint.config.mts"
      - ".prettierrc"
      - ".prettierignore"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - id: skip_check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          if [[ "$COMMIT_MSG" == *"[ci-skip]"* ]] || \
             [[ "$COMMIT_MSG" == *"[lint-skip]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  # Perform quality analysis
  quality:
    name: "Analyze (${{ matrix.language }})"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - language: "javascript-typescript"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: "Get pnpm store path"
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: "Cache pnpm store"
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Check formatting"
        run: pnpm format:check

      - name: "Run ESLint"
        run: pnpm lint
