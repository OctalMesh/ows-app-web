# ============================================================================ #
#                                 Test Workflow                                #
# ============================================================================ #
# Runs Vitest unit and integration tests on every push to dev and on every     #
# pull request targeting dev.                                                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]   - skips all workflows                                          #
#   [test-skip] - skips this workflow only                                     #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
#                                                                              #
# See: https://vitest.dev/guide/                                               #
# ============================================================================ #

name: "Test"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.config.*"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: skip_check
        env:
          SKIP_TAGS: "[ci-skip] [test-skip]"
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        # For pull_request events: use PR title + latest commit message
        # For push events: use the latest commit message from git log
        # Scheduled runs: always execute regardless of skip tags
        run: |
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --format="%s %b")
          COMBINED="${PR_TITLE} ${COMMIT_MSG}"

          for tag in $SKIP_TAGS; do
            if [[ "$COMBINED" == *"$tag"* ]]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "should_skip=false" >> $GITHUB_OUTPUT

  # Run Vitest test suite
  test:
    name: "Run Tests"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: "Setup: Get pnpm store path"
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: "Setup: Cache pnpm store"
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: "Setup: Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Run: Execute tests"
        run: pnpm test:run
