version: 2

updates:
  # Keep pnpm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "OctalMesh/development"
    labels:
      - "Dependencies"
    groups:
      next:
        patterns:
          - "next"
          - "next-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-*"
          - "tw-*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
      prettier:
        patterns:
          - "prettier"
          - "prettier-*"
          - "@trivago/prettier-*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "OctalMesh/development"
    labels:
      - "Dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
