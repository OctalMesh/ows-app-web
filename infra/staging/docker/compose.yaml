name: "octalweb-shop-staging"

# Common defaults for services.
# Reused via "<<: *defaults" to avoid duplication.
x-defaults: &defaults
  restart: "no"
  init: true
  stop_grace_period: "5s"
  env_file:
    - "../.env"
  networks:
    - "octalnet-shop-staging"

services:
  # ========================================================================== #
  #                                Applications                                #
  # ========================================================================== #

  ows-app-web:
    <<: *defaults
    container_name: "ows-app-web"
    image: "octalmesh/ows-app-web"
    build:
      context: "../../../.."
      dockerfile: "apps/web/infra/staging/docker/Dockerfile"
    ports:
      - "${SHOP_WEB_PORT:-3000}:${SHOP_WEB_PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SHOP_WEB_PORT:-3000}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

# Dedicated isolated networks
networks:
  octalnet-shop-staging:
    name: "octalnet-shop-staging"
